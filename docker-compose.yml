services:
  cg20-nginx:
    image: nginx:1.27.1-alpine3.20
    networks:
      - cg20-front-back
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - cg20-haproxy
      - cg20_1
      - cg20_2
      - cg20_3

  cg20-haproxy:
    image: haproxy:2.9
    networks:
      - cg20-front-back
    ports:
      - 8081:8080
      - 9001:9000
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - cg20-api_1
      - cg20-api_2
      - cg20-api_3

  cg20-api_1:
    image: heon0me/cg20-api:1.0
    networks:
      - cg20-front-back
    ports:
      - 8010:8000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./backend/.env:/cg20-api/.env

  cg20-api_2:
    image: heon0me/cg20-api:1.0
    networks:
      - cg20-front-back
    ports:
      - 8011:8000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./backend/.env:/cg20-api/.env

  cg20-api_3:
    image: heon0me/cg20-api:1.0
    networks:
      - cg20-front-back
    ports:
      - 8012:8000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./backend/.env:/cg20-api/.env

  cg20_1:
    image: heon0me/cg20:1.2
    networks:
      - cg20-front-back
    ports:
      - 7010:4173
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./frontend/.env:/cg20/.env

  cg20_2:
    image: heon0me/cg20:1.2
    networks:
      - cg20-front-back
    ports:
      - 7011:4173
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./frontend/.env:/cg20/.env

  cg20_3:
    image: heon0me/cg20:1.2
    networks:
      - cg20-front-back
    ports:
      - 7012:4173
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./frontend/.env:/cg20/.env

networks:
  cg20-front-back: